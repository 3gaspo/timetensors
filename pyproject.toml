[project]
name = "timetensors"
version = "0.1.0"
description = "Time-series forecasting benchmarks for data, model, and training choices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chronos-forecasting==2.0.1",
    "hydra-core>=1.3.2",
    "huggingface-hub>=0.19.0",
    "matplotlib>=3.9.4",
    "numpy>=2.2.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.2",
    "torch>=2.8.0,<2.10",
    "tsicl==0.2.0",
]

[tool.setuptools]
py-modules = ["runtime"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conf = ["*.yaml"]
visu = ["*.ipynb"]
